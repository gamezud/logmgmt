[pytest]
# Explicit, not pytest-asyncio's implicit default — "strict" requires each
# async test to carry @pytest.mark.asyncio (tests/test_db_write_roundtrip.py
# does). Without this file, recent pytest-asyncio versions emit a
# PytestDeprecationWarning and, worse, silently SKIP any @pytest.mark.asyncio
# test if the plugin isn't installed at all, which looks like a pass.
asyncio_mode = strict
