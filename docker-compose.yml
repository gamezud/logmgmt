# postgres (storage layer) + backend (FastAPI API/auth) + alert-engine
# (scheduled alert evaluation) + frontend (static SPA build, served by an
# inner Caddy) + caddy (outer reverse proxy/TLS, appliance mode: self-signed
# via the repo-root Caddyfile — see docs/DECISIONS.md #50-#53 and the
# Caddyfile itself for the appliance/SaaS split).
services:
  postgres:
    image: postgres:16
    container_name: logmgmt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only runs on a fresh volume — see backend/db/README.md.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Context is the repo root, not ./backend: the image needs both
      # backend/ and ingest/ (POST /ingest reuses ingest/normalizers and
      # ingest/db directly — see docs/DECISIONS.md).
      context: .
      dockerfile: backend/Dockerfile
    container_name: logmgmt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connects as app_user, never POSTGRES_USER — see docs/DECISIONS.md.
      # POSTGRES_HOST is the postgres *service* name here (compose's
      # internal DNS), not localhost — this container reaches Postgres over
      # the compose network, not the host's loopback interface.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    healthcheck:
      # No curl/wget in python:3.10-slim by design (smaller image) — reuse
      # the Python already in the image instead of adding a package just
      # for this.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  alert-engine:
    # Reuses the backend image (same COPY layout, same non-root user, same
    # dependencies — httpx included) rather than a second near-identical
    # Dockerfile; only the command differs. See docs/DECISIONS.md.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: logmgmt-alert-engine
    restart: unless-stopped
    command: ["python", "-m", "alerting.engine"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Same app_user credentials as backend — no JWT vars here, the engine
      # never touches a JWT (see docs/DECISIONS.md on where its tenant
      # comes from instead).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ALERT_POLL_INTERVAL_SECONDS: ${ALERT_POLL_INTERVAL_SECONDS:-30}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    # No ports exposed: nothing calls into this process, it only calls out
    # to Postgres and (optionally) a webhook URL.

  frontend:
    build:
      # Context is ./frontend, not the repo root like backend's — unlike
      # backend, frontend doesn't need source from any sibling directory,
      # so there's no reason to widen the build context.
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative path — works unchanged in both appliance and SaaS modes
        # because both put frontend and backend behind the same Caddy
        # origin. See docs/DECISIONS.md #50/#51.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: logmgmt-frontend
    restart: unless-stopped
    # No host port published: only the caddy service talks to this, over
    # the compose network.
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: logmgmt-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisted so certs (self-signed CA here, Let's Encrypt in the SaaS
      # override) survive container restarts — without this, SaaS mode
      # would re-request a cert from Let's Encrypt on every restart and
      # risk hitting its rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
